<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  #stage canvas { display: block; width: 100%; height: 100%; background: transparent; }
  #status {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    max-width: 80vw;
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(18, 25, 36, 0.62);
    color: rgba(255, 255, 255, 0.92);
    font-size: 11px;
    line-height: 1.5;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="live2d-canvas"></canvas></div>
<div id="status">正在加载 Live2D 模型…</div>
<script src="model/live2dcubismcore.min.js"></script>
<script src="model/pixi.min.js"></script>
<script src="model/pixi-live2d-display-cubism4.min.js"></script>
<script src="live2d.js"></script>
</body>
</html>
